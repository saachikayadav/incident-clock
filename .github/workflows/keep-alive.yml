name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 120 -o /dev/null -w "system %{http_code}\n" https://incident-clock.onrender.com/health
          curl -sS -m 120 -o /dev/null -w "tester %{http_code}\n" https://incident-clock-tester.onrender.com/health
