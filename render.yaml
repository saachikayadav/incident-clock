# Render Blueprint: system (Docker web service + Postgres), tester (Docker web service),
# and web frontend (Python web service, frontend/).
# All deploy only after GitHub checks (CI) pass on the commit.
services:
  - type: web
    name: incident-clock
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: API_KEY
        sync: false            # the pod's shared test key; entered once in the dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: incident-clock-db
          property: connectionString

  - type: web
    name: incident-clock-tester
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile.tester
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: TARGETS
        sync: false            # JSON {"https://<system base URL>": "<api key>", ...}; only these targets are testable

  - type: web
    name: incident-clock-frontend
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: gunicorn --chdir frontend --bind 0.0.0.0:$PORT "app:create_app()"
    autoDeployTrigger: checksPass
    envVars:
      - key: INCIDENT_API_URL
        value: https://incident-clock.onrender.com
      - key: API_KEY
        sync: false            # enter in the dashboard; same key as incident-clock
      - key: FLASK_SECRET_KEY
        generateValue: true

databases:
  - name: incident-clock-db
    plan: free
    region: ohio
    postgresMajorVersion: '16'
