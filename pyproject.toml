[project]
name = "incident-clock"
version = "0.3.0"
description = "IncidentClock - SEC Form 8-K Item 1.05 incident and deadline tracker (course project)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --junitxml=reports/junit.xml"
markers = [
    "provisional: checks a behavior the pod has not yet fixed in the contract (see docs/spec-issues.md)",
    "no_reset: do not POST /reset before this test",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is idiomatic in pytest and used as an invariant guard in db.py

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S607", "S310"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts", "tests"]
ignore_missing_imports = true
