{% extends "base.html" %}
{% block title %}Unavailable · IncidentClock{% endblock %}
{% block content %}
<section class="card">
  <h1>Can't reach the incident service</h1>
  <p class="alert">{{ message }}</p>
  <p class="muted">Check that the API is running and that INCIDENT_API_URL and API_KEY are set correctly for this frontend.</p>
  <p><a href="{{ url_for('home') }}">Try again</a></p>
</section>
{% endblock %}
