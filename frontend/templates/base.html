<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IncidentClock{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">IncidentClock</a>
    <form class="open-form" action="{{ url_for('open_incident') }}" method="get">
      <input name="id" placeholder="Find incident by ID, e.g. INC-001" aria-label="Incident ID" autocomplete="off">
      <button type="submit">Find</button>
    </form>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<p class="notice">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
